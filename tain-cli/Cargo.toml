[package]
name = "tain-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI binary for P2P remote desktop host and guest modes"

[[bin]]
name = "tain"
path = "src/main.rs"

[dependencies]
tain-core = { path = "../tain-core" }
iroh = "1"

# Async runtime + CLI framework
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }

# GUI - egui for rendering frames and capturing input
egui = "0.29"
eframe = { version = "0.29", features = ["default_fonts", "glow"] }
# svg feature powers the icon set in assets/
egui_extras = { version = "0.29", features = ["svg"] }
# egui only surfaces paste as a keyboard event; the design's "Paste passcode"
# button needs to read the clipboard on demand.
arboard = "3"

# Error handling + serialization
anyhow = "1"
thiserror = "2"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "4"

# Immersive mode: a low-level keyboard hook to capture the Win key (egui never
# reports it) and cursor clipping to keep the pointer inside the window.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_OpenGL",
    # Holding a reference on the decoder's device — see `gl_interop`.
    "Win32_Graphics_Direct3D11",
    # Registering and controlling the Tain service.
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    # ShellExecuteW with the runas verb, to elevate for install and uninstall.
    "Win32_UI_Shell",
    # SetupAPI, to create the virtual display's device node and bind a driver
    # to it. There is no higher-level way: a root-enumerated device has no
    # hardware to be discovered, so something has to assert that it exists.
    "Win32_Devices_DeviceAndDriverInstallation",
    # Telling the display driver where to keep its settings, which it reads
    # from HKLM at every start. See `display_driver::settings`.
    "Win32_System_Registry",
    # Talking to the display driver's control pipe, which is how a virtual
    # monitor is created. See `display_driver::pipe`.
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
] }

# Locating dumpbin.exe and lib.exe for the import-library regeneration.
[target.'cfg(windows)'.build-dependencies]
cc = "1"
