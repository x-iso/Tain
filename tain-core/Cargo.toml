[package]
name = "tain-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for P2P remote desktop protocol, networking, and video pipeline"

[dependencies]
# Networking - iroh 1.x P2P QUIC connections with NAT traversal (hole punching + relay)
# Note: iroh uses tokio internally; no feature flag needed — just declare tokio as a dep.
iroh = "1"
anyhow = "1"
thiserror = "2"
bytes = "1"

# Lossless frame compression. Desktop content is mostly static, so an XOR delta
# against the previous frame is nearly all zeroes and compresses enormously.
zstd = "0.13"

# Serialization - binary protocol messages over QUIC streams
serde = { version = "1", features = ["derive"] }
# The DNS cache is a small map written as JSON beside the settings.
serde_json = "1"
bincode = "1.3"

# Async runtime (shared with iroh's tokio integration)
tokio = { version = "1", features = ["full"] }

# Random number generation for passcodes
rand = "0.9"

# Deriving this machine's dialling key from the key it hosts on, so the two are
# never the same endpoint id. Already in the tree under iroh, so this adds a
# name rather than a dependency. See `network::outgoing_key`.
blake3 = "1"

# Compact encoding for connection codes. The "check" feature adds the checksum
# that makes a truncated or mangled paste fail loudly instead of parsing.
bs58 = { version = "0.5", features = ["check"] }

# Hex encoding for debug logging of secrets
hex = "0.4"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openh264 = "0.9"
iroh-mdns-address-lookup = "0.5.0"
iroh-mainline-address-lookup = "0.5.0"
n0-future = "0.3"

# Screen capture backend — windows-capture via scap (optional, pinned to avoid transitive API conflicts)
# scap = { version = "=0.0.8", optional = true }
# For now, use StubCapturer as the only backend; real capture can be added when deps align.

# Real input injection (SendInput) and screen capture (DXGI Desktop Duplication).
[target.'cfg(windows)'.dependencies]
# The `implement` macro expands to `::windows_core::...` paths, so the crate has
# to be a direct dependency rather than reached through `windows::core`.
windows-core = "0.58"
windows = { version = "0.58", features = [
    # Implementing IActivateAudioInterfaceCompletionHandler in Rust, for the
    # asynchronous activation that per-process audio capture requires.
    "implement",
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    # InjectTouchInput, for multi-touch from a guest with a touchscreen.
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct3D",
    # D3DCompile, for the HDR tone-mapping shader.
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # DisplayConfigGetDeviceInfo, for where Windows has put SDR white.
    "Win32_Devices_Display",
    # EnumDisplaySettings, for the display's real pixel count.
    # `DWMWA_CLOAKED`, which is how a window that is "visible" and not on screen
    # is told apart from one a person could actually point at. See
    # `window_capture::shareable`.
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # Decoding the desktop wallpaper for a card picture.
    "Win32_Graphics_Imaging",
    # Hardware video encoding via Media Foundation transforms.
    "Win32_Media_MediaFoundation",
    # System audio capture via WASAPI loopback, including per-process exclusion.
    "Win32_Media_Audio",
    # CreateEventW lives behind Threading but is typed against SECURITY_ATTRIBUTES.
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_StationsAndDesktops",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_RemoteDesktop",
    "Win32_System_Pipes",
    "Win32_Security_Authorization",
    # LoadLibraryW, to probe for a delay-loaded ffmpeg before calling into it.
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    # The per-application graphics preference, which is the only way to put this
    # process on the chip that draws the desktop. See `gpu_preference`.
    "Win32_System_Registry",
    # GetUserPreferredUILanguages, for following the system language. See `i18n`.
    "Win32_Globalization",
    # `PrintWindow`, which is filed under printing and is how a window is asked
    # to draw a picture of itself for the share picker. See `window_capture`.
    "Win32_Storage_Xps",
    # Windows.Graphics.Capture: frames from the compositor rather than by
    # duplicating an output this process has to own. See `capture_wgc`.
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Direct3D11",
] }

# The libavcodec shim is compiled by build.rs with the same MSVC toolchain Rust
# already needs, which keeps LLVM/bindgen out of the prerequisites.
[target.'cfg(windows)'.build-dependencies]
cc = "1"
# Compressing the ffmpeg runtime into the binary, so a single exe is portable.
zstd = "0.13"

[features]
default = []

[dev-dependencies]
iroh-mainline-address-lookup = "0.5.0"
n0-mainline = "0.6.0"
